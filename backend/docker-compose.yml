services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://syncpad:syncpad@postgres:5432/syncpad?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: syncpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncpad
      POSTGRES_PASSWORD: syncpad
      POSTGRES_DB: syncpad
    ports:
      - "5432:5432"
    volumes:
      - syncpad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncpad -d syncpad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncpad-postgres-data:
